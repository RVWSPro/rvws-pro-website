<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RVWS Pro</title>
    <script>
      // GitHub Pages SPA redirect hack
      // GitHub Pages serves this 404.html for any path that doesn't match a file.
      // We encode the intended path into the query string and redirect to index.html,
      // which recovers the clean URL via history.replaceState so the router can handle it.
      //
      // For a custom domain (root hosting), pathSegmentsToKeep = 0.
      // For a project page (e.g. user.github.io/repo/), set this to 1.
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
